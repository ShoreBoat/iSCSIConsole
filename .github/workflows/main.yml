name: Build iSCSIConsole

on:
  workflow_dispatch:
  push:
    branches:
      - autostart

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ILRepack
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "C:\Program Files\ILRepack"
          dotnet tool install dotnet-ilrepack `
            --version 2.0.46 `
            --tool-path "C:\Program Files\ILRepack"

      - name: Verify ILRepack
        shell: powershell
        run: |
          $exeExists = Test-Path "C:\Program Files\ILRepack\ILRepack.exe"
          $storeExists = Test-Path "C:\Program Files\ILRepack\.store"
          Write-Host "EXE exists: $exeExists"
          Write-Host "Store exists: $storeExists"
          if (-not $exeExists) { throw "ILRepack.exe not found" }
          if (-not $storeExists) { throw "ILRepack .store directory not found" }

      - name: Restore net472
        shell: powershell
        run: |
          msbuild ISCSIConsole/ISCSIConsole.csproj /t:Restore /p:TargetFramework=net472 /p:RestoreIgnoreFailedSources=true

      - name: Build net472
        shell: powershell
        run: |
          msbuild ISCSIConsole/ISCSIConsole.csproj /t:Build /p:Configuration=Release /p:TargetFramework=net472 /p:RestoreIgnoreFailedSources=true

      - name: List build output
        shell: powershell
        run: |
          Get-ChildItem -Recurse ISCSIConsole\bin\Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSCSIConsole-net472
          path: ISCSIConsole/bin/Release/net472/**
