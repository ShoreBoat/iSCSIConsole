name: Build iSCSIConsole

on:
  workflow_dispatch:
  push:
    branches:
      - autostart

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore net472
        shell: powershell
        run: |
          msbuild ISCSIConsole/ISCSIConsole.csproj /t:Restore /p:TargetFramework=net472 /p:RestoreIgnoreFailedSources=true

      - name: Build net472
        shell: powershell
        run: |
          msbuild ISCSIConsole/ISCSIConsole.csproj /t:Build /p:Configuration=Debug /p:TargetFramework=net472 /p:RestoreIgnoreFailedSources=true

      - name: List build output
        shell: powershell
        run: |
          Get-ChildItem -Recurse ISCSIConsole\bin\Debug\net472

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iSCSIConsole-net472-debug
          path: ISCSIConsole/bin/Debug/net472/**
