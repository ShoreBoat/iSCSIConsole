name: Publish AutoStart Release

on:
  push:
    branches:
      - autostart
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore net472
        shell: powershell
        run: |
          msbuild ISCSIConsole/ISCSIConsole.csproj /t:Restore /p:TargetFramework=net472 /p:RestoreIgnoreFailedSources=true

      - name: Build net472
        shell: powershell
        run: |
          msbuild ISCSIConsole/ISCSIConsole.csproj /t:Build /p:Configuration=Debug /p:TargetFramework=net472 /p:RestoreIgnoreFailedSources=true

      - name: Verify release files
        shell: powershell
        run: |
          $out = "ISCSIConsole\bin\Debug\net472"
          $required = @(
            "ISCSIConsole.exe",
            "ISCSIConsole.exe.config",
            "System.Resources.Extensions.dll",
            "DiskAccessLibrary.dll",
            "DiskAccessLibrary.Win32.dll",
            "ISCSI.dll",
            "Utilities.dll"
          )
          foreach ($file in $required) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) { throw "Missing release file: $file" }
          }
          Get-ChildItem $out

      - name: Create release ZIP
        shell: powershell
        run: |
          $zip = "iSCSIConsole-v1.5.6.1-AutoStart-win-net472.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "ISCSIConsole\bin\Debug\net472\*" -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v1.5.6.1-autostart.1"
          $title = "iSCSI Console v1.5.6.1 AutoStart"
          $zip = "iSCSIConsole-v1.5.6.1-AutoStart-win-net472.zip"

          @"
          ## iSCSI Console v1.5.6.1 AutoStart

          Windows AutoStart fork based on TalAloni/iSCSIConsole v1.5.6.1.

          ### Added
          - Persist listen IP and TCP port.
          - Persist target IQN and virtual disk image path.
          - Restore saved VHD/VMDK/IMG targets on startup.
          - Automatically start the iSCSI target server after restoring targets.
          - Windows scheduled-task AutoStart support with `/autostart`.
          - .NET Framework 4.7.2 Windows build and required runtime dependency configuration.

          ### Usage
          1. Download and fully extract the ZIP. Do not copy only the EXE.
          2. Run `ISCSIConsole.exe` as Administrator.
          3. Add the target and virtual disk, then click **Start** once to save the configuration.
          4. On later Windows sign-ins the application restores the saved target and starts automatically.

          ### Tested
          The AutoStart flow, target restoration and server startup have been manually verified on Windows.

          Original project: TalAloni/iSCSIConsole. Original author: Tal Aloni.
          "@ | Set-Content -Path release-notes.md -Encoding UTF8

          cmd /c "gh release view $tag --repo $env:GITHUB_REPOSITORY >nul 2>&1"
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            gh release upload $tag $zip --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title $title --notes-file release-notes.md --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            gh release create $tag $zip --target $env:GITHUB_SHA --title $title --notes-file release-notes.md --latest --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
